name: Bug report
description: Report a reproducible issue in mrpunyapal/nativephp-plugin-impressions
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: v1.0.0
    validations:
      required: true
